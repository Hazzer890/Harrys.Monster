<script>
(function(){var A='https://analytics.harrys.monster/e',v;
try{v=localStorage.getItem('_aid')||crypto.randomUUID();localStorage.setItem('_aid',v)}catch(e){v='anon'}
var t0=Date.now(),ms=0,lcp=0,cls=0,de=document.documentElement;
function send(o){o.vid=v;o.site=location.host;o.path=location.pathname+location.hash;
try{navigator.sendBeacon(A,JSON.stringify(o))}catch(e){}}
function pv(){send({t:'pv',ref:document.referrer,q:location.search,ti:document.title,
lang:navigator.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
sw:screen.width,sh:screen.height,w:innerWidth,h:innerHeight,dw:de.scrollWidth,dh:de.scrollHeight})}
pv();addEventListener('hashchange',pv);
try{new PerformanceObserver(function(l){var e=l.getEntries();lcp=Math.round(e[e.length-1].startTime)}).observe({type:'largest-contentful-paint',buffered:true});
new PerformanceObserver(function(l){l.getEntries().forEach(function(e){if(!e.hadRecentInput)cls+=e.value})}).observe({type:'layout-shift',buffered:true})}catch(e){}
addEventListener('scroll',function(){var s=(scrollY+innerHeight)/de.scrollHeight*100;if(s>ms)ms=s},{passive:true});
addEventListener('click',function(e){var el=e.target.closest?e.target.closest('a,button,[data-track]')||e.target:e.target;
var cn=typeof el.className=='string'&&el.className.trim()?'.'+el.className.trim().split(/\s+/).slice(0,2).join('.'):'';
var o={t:'click',x:e.pageX,y:e.pageY,w:innerWidth,dw:de.scrollWidth,dh:de.scrollHeight,
sel:(el.tagName.toLowerCase()+(el.id?'#'+el.id:cn)).slice(0,140)};
var a=e.target.closest&&e.target.closest('a');if(a&&a.host&&a.host!=location.host)o.out=a.href;
send(o)},true);
addEventListener('error',function(e){send({t:'error',name:String(e.message||'error').slice(0,200),
props:{src:String(e.filename||'').slice(0,200),line:e.lineno,col:e.colno}})});
addEventListener('visibilitychange',function(){if(document.visibilityState=='hidden'){var n=performance.getEntriesByType('navigation')[0];
send({t:'leave',dur:Math.round((Date.now()-t0)/1e3),scroll:Math.round(Math.min(ms,100)),
lcp:lcp,cls:Math.round(cls*1000),load:n&&n.loadEventEnd?Math.round(n.loadEventEnd):0})}});
window.track=function(n,p){send({t:'custom',name:n,props:p})};
})();
